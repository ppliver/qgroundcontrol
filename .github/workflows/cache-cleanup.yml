name: Cache Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-gc:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      # Required by the reusable cache cleanup job.
      actions: write
    uses: ./.github/workflows/_cache-cleanup.yml
    with:
      dry-run: false
      prune: true
      summary: true

  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      # Required by the reusable cache cleanup job.
      actions: write
    uses: ./.github/workflows/_cache-cleanup.yml
    with:
      branch: ${{ inputs.branch }}
      dry-run: ${{ inputs.dry-run }}
      prune: ${{ inputs.mode == 'prune' }}
      summary: true
