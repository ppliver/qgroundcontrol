name: Build Android

# Standalone Android build workflow - no Windows dependency
# Compiles QGroundControl for Android arm64-v8a and uploads the APK as artifact.

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
  # Pin aqtinstall to a known-working commit
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
  # Force pip to use Tsinghua mirror for all operations
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
  # Increase timeout for pip operations
  PIP_DEFAULT_TIMEOUT: 300

jobs:
  android-arm64:
    name: Android arm64 ${{ inputs.build_type || 'Debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PACKAGE: QGroundControl
      QT_ANDROID_ABIS: arm64-v8a
      QT_ANDROID_SIGN_APK: ON

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Configure pip globally
        shell: bash
        run: |
          python3 -m pip config set global.index-url $PIP_INDEX_URL
          python3 -m pip config set global.trusted-host $PIP_TRUSTED_HOST
          python3 -m pip config set global.timeout $PIP_DEFAULT_TIMEOUT
          echo "Pip configured:"
          python3 -m pip config list

      - name: Test pip connectivity
        shell: bash
        run: |
          echo "Testing pip connectivity..."
          python3 -m pip --version
          python3 -m pip install --dry-run aqtinstall
          echo "Pip connectivity test passed"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: android_arm64_v8a
          aqt-source: ${{ env.AQT_SOURCE }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cpm-modules: ${{ runner.temp }}/build/cpm_modules

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Create Debug Keystore
        shell: bash
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          preset: ${{ env.BUILD_TYPE == 'Debug' && 'Android-debug' || 'Android' }}
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: qgc-build.log

      - name: Prepare Artifact
        shell: bash
        run: |
          TEMP_DIR="${RUNNER_TEMP//\\//}"
          APK_DIR="${TEMP_DIR}/build/android-build"
          if ! ls "${APK_DIR}"/*.apk 1>/dev/null 2>&1; then
            echo "::error::No APK files found in ${APK_DIR}"
            ls -la "${APK_DIR}" 2>/dev/null || echo "Build directory does not exist"
            exit 1
          fi
          cp "${APK_DIR}"/*.apk "${TEMP_DIR}/build/${{ env.PACKAGE }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Android-arm64
          path: ${{ runner.temp }}/build/QGroundControl.apk
          retention-days: 14

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            ${{ runner.temp }}/build/qgc-build.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
