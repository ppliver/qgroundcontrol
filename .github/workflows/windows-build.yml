name: Build Windows x64

# Standalone Windows x64 build workflow - no Android dependency
# Compiles QGroundControl for Windows x64 and uploads the executable as artifact.

# Windows x64 already built successfully (artifact produced). Automatic push/PR
# triggers are paused to keep CI capacity on the Android build; trigger this
# workflow manually whenever a new Windows artifact is wanted.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  # Upstream pins aqtinstall for the Windows leg; the PyPI release is known to
  # regress on Windows hosts. Keep in sync with android-build.yml.
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  windows-x64:
    name: Windows x64 ${{ inputs.build_type || 'Release' }}
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies
        with:
          nsis: 'true'
          gstreamer: 'true'

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: ${{ env.BUILD_TYPE }}

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          preset: ${{ env.BUILD_TYPE == 'Debug' && 'Windows-debug' || 'Windows' }}
          extra-args: >-
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON
            -DQGC_CPACK_GENERATOR=NSIS

      # GStreamer lives outside the Qt sysroot; the build (and any post-build
      # tooling) needs it on PATH, otherwise the link/runtime probes fail.
      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        run: echo "${STEPS_GST_ROOT_OUTPUTS_GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          STEPS_GST_ROOT_OUTPUTS_GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Windows-x64
          path: |
            ${{ runner.temp }}/build/${{ env.BUILD_TYPE }}/QGroundControl.exe
            ${{ runner.temp }}/build/QGroundControl.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure
          path: |
            ${{ runner.temp }}/build/CMakeFiles/*.log
            ${{ runner.temp }}/build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
